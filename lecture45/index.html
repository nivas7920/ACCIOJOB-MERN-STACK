<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

    <textarea></textarea>
    <script>
     function checkLocalStorage(){

        try{
            const key = "key";
            const value ="value";

            localStorage.setItem(key, value);

            if(localStorage.getItem(key) === value) return true;
            return false;
        }
        catch(error){
            return false;
        }
     }



     const autoSaveKey = "autoSaveKey";
     const textarea = document.querySelector("textarea");

     textarea.value = localStorage.getItem(autoSaveKey);

     textarea.addEventListener("input", ()=>{
        const newValue = textarea.value;
        localStorage.setItem(autoSaveKey, newValue);
     });
     console.log(checkLocalStorage());

     // Converting non string data into string, so that we can store them in localstorag
 
      const obj ={
        name:"Nivas",
        age:22
      };
     const objInString = JSON.stringify(obj);
     localStorage.setItem("obj",objInString);

     console.log(JSON.parse(localStorage.getItem("obj")));


    </script>
    
</body>
</html>

 <script>
        let currentStep = 0;
        const steps = document.querySelectorAll(".form-step");

        function showStep() {
            steps.forEach((step, i) => {
                step.classList.toggle("active", i === currentStep);
            });
        }

        function nextStep() {
            if (currentStep < steps.length - 1) {
                currentStep++;
                showStep();
            }
        }

        function prevStep() {
            if (currentStep > 0) {
                currentStep--;
                showStep();
            }
        }
    </script>
